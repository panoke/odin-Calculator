<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Odin Foundations - Calculator</title>
</head>
<body>
    <div id="calculator">
        <div id="display">0</div>
        <div id="input">
            <button id="zero" class="digit">0</button>
            <button id="one" class="digit">1</button>
            <button id="two" class="digit">2</button>
            <button id="three" class="digit">3</button>
            <button id="four" class="digit">4</button>
            <button id="five" class="digit">5</button>
            <button id="six" class="digit">6</button>
            <button id="seven" class="digit">7</button>
            <button id="eight" class="digit">8</button>
            <button id="nine" class="digit">9</button>
            <button id="add" class="operator" value="+">+</button>
            <button id="multiply" class="operator" value="*">&times;</button>
            <button id="minus" class="operator" value="-">-</button>
            <button id="divide" class="operator" value="/">&divide;</button>
            <button id="equals" class="operator" value="=">=</button>
            <button id="decimal" class="digit">.</button>
            <button id="backspace">&#x232B;</button>
            <button id="clear">AC</button>
            <button id="sign">&plusmn;</button>
        </div>
    </div>
</body>
</html>
